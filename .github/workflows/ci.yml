# Checks every push and pull request: typechecks and builds both apps, runs the
# Vitest + Supertest suite, then starts the built API and runs the end-to-end smoke tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite build

  server:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miniedcrm
          POSTGRES_PASSWORD: miniedcrm
          POSTGRES_DB: miniedcrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miniedcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No Redis, like the free Render setup: in-memory cache and the Postgres email queue.
      DATABASE_URL: postgresql://miniedcrm:miniedcrm@localhost:5432/miniedcrm?schema=public
      TEST_DATABASE_URL: postgresql://miniedcrm:miniedcrm@localhost:5432/miniedcrm_test?schema=public
      JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      QUEUE_BACKEND: postgres
      BCRYPT_ROUNDS: "10"
      SEED_ADMIN_EMAIL: admin@miniedcrm.test
      SEED_ADMIN_PASSWORD: Admin@12345
      SEED_MENTOR_EMAIL: mentor@miniedcrm.test
      SEED_MENTOR_PASSWORD: Mentor@12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

      - name: Unit and API tests (Vitest + Supertest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare the smoke-test database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Start the API
        run: |
          # Short retries so the email checks can watch a failing email reach FAILED.
          EMAIL_RETRY_DELAY_MS=300 EMAIL_MAX_ATTEMPTS=3 nohup node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/api/health && exit 0
            sleep 1
          done
          echo "The API didn't start:"; cat api.log; exit 1

      - name: End-to-end smoke tests
        run: npm run test:smoke

      - name: API log
        if: always()
        run: cat api.log || true
