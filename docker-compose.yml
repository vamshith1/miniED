# Local development services. The API and frontend containers get added
# in the deployment phase; for now the API runs on your machine with `npm run dev`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: miniedcrm-postgres
    environment:
      POSTGRES_USER: miniedcrm
      POSTGRES_PASSWORD: miniedcrm
      POSTGRES_DB: miniedcrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniedcrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: miniedcrm-redis
    # appendonly keeps queued email jobs safe if Redis restarts
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
