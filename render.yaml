# Render Blueprint: one free web service running the API, the web app and the
# email worker together. The database is Neon (free Postgres), not Render's,
# because Render deletes free databases after 30 days. See DEPLOY.md.
services:
  - type: web
    name: miniedcrm
    runtime: node
    plan: free
    region: singapore # closest free region to India; pick Neon's region to match
    buildCommand: npm run build
    startCommand: npm start # applies database migrations, then starts the server
    healthCheckPath: /api/health
    autoDeploy: true # redeploys on every push to the connected branch
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata # "today" and the 9:00 reminders use India time
      # Secrets you paste in when creating the Blueprint (see DEPLOY.md):
      - key: DATABASE_URL
        sync: false # Neon's DIRECT connection string (not the pooled one)
      - key: CLIENT_URL
        sync: false # this site's address, e.g. https://miniedcrm.onrender.com
      - key: SMTP_URL
        sync: false # e.g. smtp://LOGIN:SMTP_KEY@smtp-relay.brevo.com:587
      - key: MAIL_FROM
        sync: false # e.g. MiniEdCRM <you@gmail.com> (a sender verified in Brevo)
      # Generated by Render, never typed by hand:
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true # copy it into the GitHub secret of the same name
      # Settings for a single free server:
      - key: TRUST_PROXY
        value: "1" # Render's proxy sits in front: rate limits need the real visitor IP
      - key: QUEUE_BACKEND
        value: postgres # no Redis needed: email jobs live in Neon
      - key: FILE_STORAGE
        value: database # the free plan's disk is wiped on every deploy
      - key: BCRYPT_ROUNDS
        value: "10" # the free CPU is slow; 10 keeps sign-in under a second or two
